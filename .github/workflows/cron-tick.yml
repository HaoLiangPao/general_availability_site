name: OpenCalendar cron tick

# Development-stage manual runner for /api/cron/tick. Before accepting real
# bookings, configure a production scheduler as described in docs/RELIABILITY.md.
# Set BOOKKIT_URL (Actions repository variable) to the target instance and
# CRON_SECRET (Actions repository secret) to its matching deployment secret.

on:
  workflow_dispatch:

jobs:
  tick:
    if: vars.BOOKKIT_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/tick
        run: |
          curl -sS -f -X POST "${{ vars.BOOKKIT_URL }}/api/cron/tick" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
